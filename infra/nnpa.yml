# NNPA shadow scoring (Ahmed, brief task 13): Nate's Keras hazard model on the Telum NNPA, beside the live KM curve.
# It only logs predictions for grading; triage keeps KM. It holds no signer token: checking a signature needs none.
# The model and its release signature live outside the repo, in ~/models on the VM (scripts/sign-model.sh).
services:
  nnpa:
    image: bn-app:latest
    working_dir: /srv
    command: ["/opt/venv/bin/python", "-m", "app.nnpa"]
    # Nate's feature code is mounted as the `ml` package, so the shadow builds exactly the inputs M2 was trained on
    volumes: ["../backend:/srv:ro", "../ml:/repo/ml:ro", "../../models:/models:ro"]
    environment:
      BN_DB_HOST: db
      BN_DB_NAME: blacknaught
      BN_SECRETS_DIR: /run/secrets
      BN_SIGNER_URL: http://signer:8100
      BN_NNPA_MODEL: /models/m2_hazard.keras
      PYTHONPATH: /repo
    secrets: [db_agent_pw]
    networks: [default, signing]
    mem_limit: 1536m
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      signer:
        condition: service_healthy
