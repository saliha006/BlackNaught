# The production stack (Ahmed): Sali's backend as it runs today, plus the signer. Deploy only from the VM's deploy copy:
#   cd ~/BlackNaught && sudo docker compose -f infra/docker-compose.yml up -d
# The project name is the live stack's, so an `up` from any other clone would swap that clone's code into the live app.
# Once this is live, keep using it: an `up` from backend/ alone would take the signer settings back off `app`.
name: bn-backend  # the running stack's project, so db, app and the pgdata volume carry on as they are

include:
  # Sali's file stays untouched; signer.yml is layered over it the way a second -f would be.
  - path:
      - ../backend/compose.backend.yml
      - signer.yml
