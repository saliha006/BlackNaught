# The production stack (Ahmed): Sali's backend as it runs today, plus the signer, the edge, the agent and Granite.
#   cd ~/BlackNaught && sudo docker compose -f infra/docker-compose.yml up -d
# The project name is the live stack's, so an `up` from any other clone would swap that clone's code into the live app.
# Once this is live, keep using it: an `up` from backend/ alone would take the signer settings back off `app`.
name: bn-backend  # the running stack's project, so db, app and the pgdata volume carry on as they are

include:
  # Sali's file stays untouched; the other files are layered over it the way more -f files would be.
  - path:
      - ../backend/compose.backend.yml
      - signer.yml
      - agent.yml
      - granite.yml
      - nnpa.yml

services:
  edge:
    build: edge
    image: bn-edge:latest
    ports: ["8443:8443"]
    secrets: [edge_cert, edge_key]
    volumes: ["../frontend/dist:/srv/www:ro"]
    read_only: true
    tmpfs: [/tmp, /var/lib/nginx, /var/log/nginx]
    mem_limit: 64m
    restart: unless-stopped
    depends_on: [app]
    healthcheck:
      test: ["CMD", "curl", "-kfs", "-o", "/dev/null", "https://127.0.0.1:8443/"]
      interval: 15s
      retries: 4

secrets:
  edge_cert: {file: ../secrets/edge_cert.pem}
  edge_key: {file: ../secrets/edge_key.pem}
