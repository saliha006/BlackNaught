# The public entry point: Rama's built UI, plus /api and /stream from the app. TLS 1.3 offers the post-quantum hybrid
# key exchange (X25519MLKEM768) first and classic groups after it, for clients that don't support it yet.
worker_processes 1;
pid /tmp/nginx.pid;  # the root filesystem is read-only; /tmp is the container's tmpfs
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 1m;

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /run/secrets/edge_cert;
        ssl_certificate_key /run/secrets/edge_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        root /srv/www;
        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://app:8000;
            include /etc/nginx/proxy_params;
        }

        # Server-sent events: buffering would hold updates back, and the default 60 s read timeout would cut the stream.
        location = /stream {
            proxy_pass http://app:8000;
            include /etc/nginx/proxy_params;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
