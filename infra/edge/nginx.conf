# The public entry point: Rama's built UI, plus /api and /stream from the app. TLS 1.3 offers the post-quantum hybrid
# key exchange (X25519MLKEM768) first and classic groups after it, for clients that don't support it yet.
worker_processes 1;
pid /tmp/nginx.pid;  # the root filesystem is read-only; /tmp is the container's tmpfs
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 1m;
    # Docker's DNS, asked per request: `app` gets a new IP whenever it's recreated, and the edge must neither keep a
    # stale address nor refuse to start while the app is restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        set $app http://app:8000;
        listen 8443 ssl;
        http2 on;
        ssl_certificate /run/secrets/edge_cert;
        ssl_certificate_key /run/secrets/edge_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # The UI's JS is ~1.1 MB raw and ~300 kB gzipped; on a phone over 4G that difference is most of the load time.
        # text/event-stream is left out on purpose: compressing /stream would buffer the live updates.
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_types application/javascript text/css application/json image/svg+xml;

        root /srv/www;
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite puts a content hash in every asset name, so a file at a given URL never changes and can be cached for good.
        # add_header here replaces the server-level ones, so they're repeated.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }

        location /api/ {
            proxy_pass $app;
            include /etc/nginx/proxy_params;
        }

        # Server-sent events: buffering would hold updates back, and the default 60 s read timeout would cut the stream.
        location = /stream {
            proxy_pass $app;
            include /etc/nginx/proxy_params;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
